name: MoonBit CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: "0.1.20260807"

      - name: Toolchain version
        run: moon version --all
          
      - name: MoonBit Check
        run: moon check --deny-warn
        
      - name: MoonBit Format Check
        run: moon fmt --check

      - name: MoonBit Info Check
        # `moon info` has no --deny-warn option in the 0.10.x CLI.
        run: |
          moon info
          git diff --exit-code

      - name: MoonBit Build
        run: moon build
        
      - name: MoonBit Test
        run: moon test --deny-warn

      - name: MoonBit Native Test
        run: moon test --deny-warn --target native

      - name: CLI smoke tests
        run: |
          moon run cmd/main -- inspect
          moon run cmd/main -- validate
          moon run cmd/main -- files
          moon run cmd/main -- pieces
          moon run cmd/main -- magnet
          moon run cmd/main -- profile

