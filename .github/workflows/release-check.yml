name: MoonBit Package Check

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup latest MoonBit CLI
        uses: hustcer/setup-moonbit@v1
        with:
          version: "latest"
      - name: Verify package
        run: |
          moon version --all
          moon check --deny-warn
          moon fmt --check
          moon info
          git diff --exit-code
          moon build
          moon test --deny-warn
      - name: Verify published Mooncakes package
        run: |
          status=$(curl -L -s -o /tmp/moon_bencode_mooncakes.html -w "%{http_code}" https://mooncakes.io/packages/2515050243qyf/moon_bencode)
          test "$status" = "200"
